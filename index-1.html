<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="A first look at the new drop, before it goes on sale.">
<meta name="theme-color" content="#0f3d3e">
<title>Bishal Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Minimal stand-in for the Tailwind utilities used by the hero (published single-file preview only) */
*,::before,::after{box-sizing:border-box;border:0 solid}
h1,h2,h3,p,dl,dd,ul{margin:0}
button{font:inherit;color:inherit;background:transparent;padding:0;border:0;cursor:pointer;text-transform:none}
img,svg{display:block}
img{max-width:100%}
.relative{position:relative}.absolute{position:absolute}
.w-full{width:100%}.overflow-hidden{overflow:hidden}
.inset-0{inset:0}.inset-x-0{left:0;right:0}
.flex{display:flex}.items-center{align-items:center}.justify-center{justify-content:center}
.pointer-events-none{pointer-events:none}.select-none{user-select:none;-webkit-user-select:none}
.top-6{top:1.5rem}.left-4{left:1rem}.bottom-6{bottom:1.5rem}.right-4{right:1rem}
.text-xs{font-size:.75rem;line-height:1rem}.text-sm{font-size:.875rem;line-height:1.25rem}.text-base{font-size:1rem;line-height:1.5rem}
.font-semibold{font-weight:600}.font-bold{font-weight:700}.uppercase{text-transform:uppercase}.tracking-widest{letter-spacing:.1em}
.mb-2{margin-bottom:.5rem}.mb-4{margin-bottom:1rem}.gap-3{gap:.75rem}
.hidden{display:none}
.w-12{width:3rem}.h-12{height:3rem}.w-5{width:1.25rem}.h-5{height:1.25rem}.rounded-full{border-radius:9999px}
@media (min-width:640px){
 .sm\:left-8{left:2rem}.sm\:bottom-20{bottom:5rem}.sm\:left-24{left:6rem}.sm\:right-10{right:2.5rem}
 .sm\:mb-3{margin-bottom:.75rem}.sm\:mb-5{margin-bottom:1.25rem}.sm\:text-\[22px\]{font-size:22px}.sm\:text-sm{font-size:.875rem;line-height:1.25rem}
 .sm\:block{display:block}.sm\:w-16{width:4rem}.sm\:h-16{height:4rem}.sm\:w-8{width:2rem}.sm\:h-8{height:2rem}
}

:root {
  --bone: #efe9dd;
  --midnight: #0a0f22;
  --hibiscus: #e26a8d;
  --muted: rgba(239, 233, 221, 0.74);
  --display: 'Anton', Impact, 'Arial Narrow', sans-serif;
}

html {
  -webkit-text-size-adjust: 100%;
}
body {
  font-synthesis: none;
  margin: 0;
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #0f3d3e;
}
:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}

/* ---------- Carousel ---------- */
.hero-h {
  height: 100vh;
  height: 100svh;
}
.cf-item:focus-visible {
  outline-offset: 6px;
}
.cf-float {
  position: relative;
  animation: cf-drift 9s ease-in-out infinite alternate;
  user-select: none;
  -webkit-user-drag: none;
}
.cf-shadow {
  position: absolute;
  left: 10%;
  right: 10%;
  bottom: -2%;
  height: 7%;
  background: radial-gradient(closest-side, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0));
  filter: blur(6px);
  pointer-events: none;
}
@keyframes cf-drift {
  from { transform: translateY(-4px); }
  to   { transform: translateY(4px); }
}
.cf-circle:hover {
  transform: scale(1.08);
  background-color: rgba(255, 255, 255, 0.12) !important;
}
.cf-link {
  opacity: 0.95;
}
.cf-link:hover {
  opacity: 1;
}

/* ---------- 3D view (details sheet) ---------- */
.stage {
  --d: 34px; /* thickness of the piece */
  position: relative;
  display: block;
  aspect-ratio: var(--ar);
  perspective: 1300px;
}
.tt-stage {
  height: min(58vh, 500px, calc((100vw - 4rem) / var(--ar)));
  height: min(58svh, 500px, calc((100vw - 4rem) / var(--ar)));
  cursor: grab;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
}
.tt-stage:active {
  cursor: grabbing;
}
.stage::after {
  content: '';
  position: absolute;
  left: 12%;
  right: 12%;
  bottom: -5%;
  height: 7%;
  background: radial-gradient(closest-side, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0));
  filter: blur(7px);
  pointer-events: none;
}
.model {
  position: absolute;
  inset: 0;
  display: block;
  transform-style: preserve-3d;
  will-change: transform;
}
.layer {
  position: absolute;
  inset: 0;
  display: block;
  background-repeat: no-repeat;
  background-size: 100% 100%;
  transform: translateZ(calc(var(--d) * var(--k)));
  pointer-events: none;
}
.layer.back {
  transform: translateZ(calc(var(--d) * -0.5)) scaleX(-1);
  filter: brightness(0.55);
}

/* ---------- Details sheet ---------- */
dialog.sheet {
  margin: auto;
  padding: 0;
  border: 1px solid rgba(15, 61, 62, 0.16);
  width: min(920px, calc(100vw - 2rem));
  max-height: calc(100vh - 2rem);
  max-height: calc(100svh - 2rem);
  overflow: auto;
  overscroll-behavior: contain;
  background: #ffffff;
  color: #0f3d3e;
  border-radius: 10px;
  position: fixed;
  font-family: 'Inter', sans-serif;
}
dialog.sheet::backdrop {
  background: rgba(4, 28, 29, 0.72);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}
dialog.sheet[open] {
  animation: sheet-rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
}
dialog.sheet[open]::backdrop {
  animation: sheet-fade 0.5s ease;
}
@keyframes sheet-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes sheet-fade { from { opacity: 0; } to { opacity: 1; } }

.sheet-body {
  display: grid;
  grid-template-columns: minmax(0, 0.95fr) minmax(0, 1fr);
}
.sheet-img {
  background: radial-gradient(90% 70% at 50% 35%, #f6faf8, #d9e6e2 80%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.25rem;
  padding: 3.5rem 1.5rem 1.75rem;
  min-height: 100%;
}
.sheet-img .hint {
  color: rgba(15, 61, 62, 0.72);
  font-size: 0.875rem;
  text-align: center;
  max-width: 18rem;
}
.sheet-info {
  padding: clamp(1.5rem, 4vw, 2.75rem);
}
.sheet-info h2 {
  font-family: var(--display);
  font-weight: 400;
  text-transform: uppercase;
  font-size: clamp(2rem, 5vw, 3rem);
  line-height: 1;
  letter-spacing: -0.01em;
  padding-right: 4.5rem;
}
.sheet-info .status {
  margin-top: 0.5rem;
  color: #1f7a6d;
  font-weight: 500;
}
.sheet-info .blurb {
  margin-top: 1.25rem;
}
.sheet-info dl {
  margin: 1.5rem 0 0;
  display: grid;
  gap: 1rem;
}
.sheet-info dt {
  color: rgba(15, 61, 62, 0.72);
  font-size: 0.9375rem;
}
.sheet-info dd {
  margin: 0.125rem 0 0;
}
.sheet-info .sheet-sub {
  margin: 1.75rem 0 0.5rem;
  color: rgba(15, 61, 62, 0.72);
  font-size: 0.9375rem;
  font-weight: 400;
}
.sheet-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 0.375rem;
}
.sheet-list li {
  padding-left: 1.1rem;
  position: relative;
}
.sheet-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.62em;
  width: 0.4rem;
  height: 0.4rem;
  border-radius: 50%;
  background: #1f7a6d;
}
.sheet-info .note {
  margin-top: 1.5rem;
  padding-top: 1.25rem;
  border-top: 1px solid rgba(15, 61, 62, 0.16);
  color: rgba(15, 61, 62, 0.72);
  font-size: 0.9375rem;
}
.sheet-close {
  position: absolute;
  top: 0.75rem;
  right: 0.75rem;
  z-index: 2;
  min-height: 2.75rem;
  padding: 0 1.1rem;
  border-radius: 999px;
  background: #0f3d3e;
  color: #ffffff;
  border: 0;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 0.9375rem;
}
.sheet-close:hover {
  background: #1f7a6d;
}
dialog.sheet :focus-visible {
  outline-color: #0f3d3e;
}

@media (max-width: 720px) {
  .stage { --d: 24px; }
  dialog.sheet {
    width: 100vw;
    max-width: 100vw;
    margin: auto 0 0 0;
    max-height: 92vh;
    max-height: 92svh;
    border-radius: 16px 16px 0 0;
    border-bottom: 0;
  }
  dialog.sheet[open] { animation-name: sheet-rise-up; }
  @keyframes sheet-rise-up { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  .sheet-body { grid-template-columns: 1fr; }
  .sheet-img { padding: 3.75rem 1rem 1.25rem; }
  .tt-stage {
    height: min(40vh, 340px, calc((100vw - 3rem) / var(--ar)));
    height: min(40svh, 340px, calc((100vw - 3rem) / var(--ar)));
  }
}

@media (prefers-reduced-motion: reduce) {
  .cf-item,
  .cf-circle {
    transition-duration: 0.01ms !important;
  }
  .cf-float { animation: none; }
  dialog.sheet[open],
  dialog.sheet[open]::backdrop { animation: none; }
}

html,body{background:#0f3d3e}
</style>
</head>
